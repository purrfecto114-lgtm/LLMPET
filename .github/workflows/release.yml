name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gate:
    name: Detect Apple signing credentials
    runs-on: ubuntu-latest
    outputs:
      has-apple-creds: ${{ steps.detect.outputs.has }}
    steps:
      # secrets 只能在 step 环境里读（job 级 if 不支持 secrets 上下文），
      # 用一个轻量 gate job 把检测结果变成 output。
      - id: detect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_DEVELOPER_ID_P12_BASE64" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build macOS ARM64
    # macOS 公开发布 fail-closed 是设计约束（无凭证绝不产出未签名包）。
    # fork 没配 Apple 签名凭证时跳过本 job（skipped 对 needs 等价于通过），
    # Windows/Linux 产物照常发布；配置了凭证的仓库行为不变（三平台齐全）。
    needs: release-gate
    if: needs.release-gate.outputs.has-apple-creds == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      - name: Validate Apple release credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_DEVELOPER_ID_P12_BASE64"
          test -n "$APPLE_DEVELOPER_ID_P12_PASSWORD"
          node scripts/sign-notarize-mac.js --check-env
      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/llmpet-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/llmpet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application:'
          echo "MAC_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Sign, notarize and package macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac
      - name: Verify macOS package
        run: npm run verify:mac
      - uses: actions/upload-artifact@v4
        with:
          name: llmpet-macos-arm64
          path: dist/LLMPET-*-mac-arm64.zip
          if-no-files-found: error
      - name: Delete temporary signing keychain
        if: always()
        run: |
          if [[ -n "${MAC_SIGNING_KEYCHAIN:-}" && -f "$MAC_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$MAC_SIGNING_KEYCHAIN"
          fi

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - name: List Windows packages
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: llmpet-windows-x64
          path: |
            dist/LLMPET-*-Windows-x64.exe
            dist/LLMPET-*-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      # The lockfile itself must only reference public npmjs tarball URLs —
      # internal mirrors are unreachable from public runners (regression guard
      # is also enforced by npm test via test/lockfile-hygiene.js).
      - run: npm ci
      - run: npm test
      - run: npm run package:linux
      - name: List Linux packages
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: llmpet-linux-x64
          # electron-builder 的 arch 令牌按目标平台惯例展开：
          # AppImage → x86_64，deb → amd64（Debian 命名）。首次真实打包
          # 验证过的产物名，不要改成 x64。
          path: |
            dist/LLMPET-*-Linux-x86_64.AppImage
            dist/LLMPET-*-Linux-amd64.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    # needs 里有 skipped 任务时，下游默认也会被跳过 —— 必须用 !cancelled()
    # 显式放行，再逐一检查各构建结果：Windows/Linux 必须成功；macOS 允许
    # skipped（未配置 Apple 凭证的 fork）或成功（配置了凭证的三平台齐全）。
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LLMPET ${GITHUB_REF_NAME#v}" \
            --generate-notes
